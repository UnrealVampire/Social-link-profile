<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="social">
    <img src="./assets/images/avatar-jessica.jpeg">
    <h3>Jessica Randall</h3>
    <p id="UK">London, United Kingdom</p>
    <p id="Front">"Frontend Developer and avid reader"</p>
    <div class="links">
      <a id="first">Website</a>
      <a id="second">Twitter</a>
      <a id="third">Instagram</a>
      <a id="fourth">LinkedIn</a>
      <a id="fifth">GitHub</a>
    </div>
  </div>
  
  <br>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Koenig</a>.
  </footer>
</body>
</html>
